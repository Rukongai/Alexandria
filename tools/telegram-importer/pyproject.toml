[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alexandria-telegram-importer"
version = "0.1.0"
description = "Import model media from Telegram channels into Alexandria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptg>=0.5.2",
  "filelock>=3.20.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
  "telethon>=1.42.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
alexandria-telegram-import = "alexandria_telegram_importer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_telegram_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
